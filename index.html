<div id="site-buttons"></div>

<script>
function createSiteButtons(container, sites) {
  const group = document.createElement("nav");
  group.className = "button-group";
  group.setAttribute("aria-label", "Choose a site");

  for (const site of sites) {
    const link = document.createElement("a");
    link.className = "site-button";
    link.href = site.url;
    link.textContent = site.label;
    group.append(link);
  }

  container.replaceChildren(group);
}

createSiteButtons(document.querySelector("#site-buttons"), [
  { label: "Example", url: "https://example.com" },
  { label: "News", url: "https://news.example.com" }
]);
</script>
